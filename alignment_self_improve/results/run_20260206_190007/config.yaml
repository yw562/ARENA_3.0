# ------------------------------------------------------------
# Experiment configuration: Instruct model self-improvement
# ------------------------------------------------------------

experiment:
  name: "instruct_self_improvement"
  description: >
    Measure alignment and capability drift under iterative
    self-improvement starting from an aligned (instruct) model.

# ------------------------------------------------------------
# Model configuration
# ------------------------------------------------------------

model:
  base_checkpoint: "accounts/fireworks/models/kimi-k2-instruct-0905"
  tokenizer: "accounts/fireworks/models/kimi-k2-instruct-0905"
  # base_checkpoint: "accounts/fireworks/models/qwen3-vl-30b-a3b-instruct"
  # tokenizer: "accounts/fireworks/models/qwen3-vl-30b-a3b-instruct"
  # base_checkpoint: "accounts/fireworks/models/qwen3-8b"
  # tokenizer: "accounts/fireworks/models/qwen3-8b"
  # base_checkpoint: "accounts/fireworks/models/qwen3-vl-30b-a3b-thinking"
  # tokenizer: "accounts/fireworks/models/qwen3-vl-30b-a3b-thinking"
  # base_checkpoint: "accounts/fireworks/models/qwen3-4b-instruct-2507"
  # tokenizer: "accounts/fireworks/models/qwen3-4b-instruct-2507"
  # base_checkpoint: "meta-llama/Llama-3.2-3B"
  # tokenizer: "meta-llama/Llama-3.2-3B"
  # base_checkpoint: "deepseek-ai/DeepSeek-V3.1-Base"
  # tokenizer: "deepseek-ai/DeepSeek-V3.1-Base"
  # base_checkpoint: "meta-llama/Llama-3.2-1B"
  # tokenizer: "meta-llama/Llama-3.2-1B"
  # base_checkpoint: "meta-llama/Llama-3.1-8B-Instruct"
  # tokenizer: "meta-llama/Llama-3.1-8B-Instruct"
  # dtype: "bfloat16"
  dtype: "float16"
  device: "cuda"
  #chose Qwen/Qwen3-4B-Instruct-2507 becasue instruct model is more aligned than base model, cheap, quick, stable, dense -- update: thinker backend is running shrot on capacity, cannot use



# ------------------------------------------------------------
# Self-improvement loop
# ------------------------------------------------------------

loop:
  num_iterations: 0 # tinker: 0 means only baseline

# ------------------------------------------------------------
# Generation (Step 1)
# ------------------------------------------------------------

generation:
  task: "gsm8k"
  num_samples: 100 #ideal: 100
  max_new_tokens: 1024 # ideal:512
  temperature: 0.0
  top_p: 1.0

  # prompt_template: |
  #   Solve the following math problem step by step.

  #   Problem:
  #   {question}

  #   At the end, output the final answer on a new line in the format:
  #   #### <number>

  #   Answer:
  prompt_template: |
    Solve the following math problem step by step.

    Problem:
    {question}

    IMPORTANT:
    - Give your reasoning.
    - On the FINAL line ONLY, output the answer in the exact format:
    #### <number>
    - Do NOT write anything after the #### line.

    Answer:


# ------------------------------------------------------------
# Filtering (Step 2)
# ------------------------------------------------------------

filtering:
  method: "exact_match"
  require_final_answer: true
  min_reasoning_length: 0

# ------------------------------------------------------------
# Training (Step 3)
# ------------------------------------------------------------

training:
  mode: "train"      # NEW: phase-2(fireworks)
  method: "lora"      
  # mode: "frozen"      # NEW: phase-1 frozen-policy loop(fireworks)
  # method: "lora"      # keep for compatibility; ignored in frozen
  learning_rate: 1e-4
  batch_size: 8 #ideal 8
  max_steps: 50 # ideal: 50
  gradient_accumulation_steps: 1
  save_every: 200

# ------------------------------------------------------------
# Capability evaluation
# ------------------------------------------------------------

eval_capability:
  task: "gsm8k"
  split: "test"
  batch_size: 8
  #should be delete '  limit: 5 ' in future, just for the limitest first run
  limit: 50

# ------------------------------------------------------------
# Safety / alignment evaluation
# ------------------------------------------------------------

eval_safety:
  benchmark: "advbench"
  refusal_prompt_version: "v1"
  temperature: 0.0
  limit: 50 # idea： 50， 10 is for quick test run
  # Metric definition:
  # - refusal_rate = hard refusal only (explicit refusal, zero leakage)
  # - leakage is tracked separately as alignment failure


# ------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------

reproducibility:
  seed: 42
  deterministic: true
